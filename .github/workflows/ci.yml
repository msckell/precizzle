name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        # An explicit bash runs with -eo pipefail, so a failing go test is not
        # hidden by the tee that follows it. The default shell has no pipefail.
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # The backend has no dependencies, so there is no go.sum to cache.
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./... | tee "$RUNNER_TEMP/test-output.txt"

      - name: Check coverage thresholds
        run: |
          status=0
          {
            echo "| Package | Coverage | Minimum |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r pkg minimum; do
            coverage="$(awk -v pkg="github.com/msckell/precizzle/backend/$pkg" '
              $2 == pkg { for (i = 1; i < NF; i++) if ($i == "coverage:") print substr($(i + 1), 1, length($(i + 1)) - 1) }
            ' "$RUNNER_TEMP/test-output.txt")"
            echo "| $pkg | ${coverage:-missing}% | $minimum% |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$coverage" ] || awk -v c="$coverage" -v m="$minimum" 'BEGIN { exit !(c < m) }'; then
              echo "::error::$pkg coverage is ${coverage:-missing}%, below the minimum of $minimum% (D34, D51)"
              status=1
            fi
          done <<'EOF'
          internal/calc 95
          internal/api 90
          internal/expr 95
          EOF
          exit "$status"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 31 needs Node ^24.15.0; "24" resolves to the newest 24.x release.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The coverage thresholds in vite.config.ts fail this step below 90% of statements.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build
